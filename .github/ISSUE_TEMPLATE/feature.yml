name: Feature request
description: Propose a focused product or compatibility improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Draft safety and Session lifecycle
      description: Explain what should happen on reload, Host restart, and rejected Send.
    validations:
      required: true
